# -----------------------------------------------------------------------------
# Core & Keybindings
# -----------------------------------------------------------------------------
# Change prefix key to Ctrl-A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload configuration with confirmation feedback
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded."

# Ergonomics: 1-indexed windows/panes and auto-renumbering
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# Enable mouse support and vi-style selection modes
set -g mouse on
setw -g mode-keys vi

# Set the global prefix to ctr+a
set -g prefix C-a

# -----------------------------------------------------------------------------
# Terminal & Performance Tuning
# -----------------------------------------------------------------------------
# Prevent ESC key delay without causing escape sequence fragmentation
set -sg escape-time 5 
# set -sg escape-time 0 # Old setting

# Pass focus events through to applications (critical for Neovim)
set -g focus-events on

# Enable 24-bit TrueColor support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Layout
set -g status-position top

# -----------------------------------------------------------------------------
# Plugins (managed via TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Nybkox/tmux-ukiyo'

# Ukiyo Theme Settings
set -g @ukiyo-plugins "ssh-session cpu-usage ram-usage battery"
set -g @ukiyo-show-powerline true
set -g @ukiyo-show-left-sep "█"
set -g @ukiyo-show-left-icon hostname
set -g @ukiyo-theme "kanagawa/wave"

# Initialize TMUX plugin manager (keep at the bottom)
run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# Post-Plugin Overrides (Must be placed AFTER tpm initialization)
# =============================================================================
# Add horizontal character padding to inactive and active tabs
# set -g window-status-format "    #I:#W#F    "
# set -g window-status-current-format "    #I:#W#F    "

# Force transparent backgrounds
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g status-style "bg=default"
set -g pane-border-style "bg=default"
set -g pane-active-border-style "bg=default"
